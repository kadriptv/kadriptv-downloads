name: QA APK 302 signature transfer (one-off)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: KADR-HLS-TEST-302-signed-patch
          path: qa-transfer/KADR_HLS_TEST_302_signed_delta.base64
          if-no-files-found: error
          retention-days: 1
